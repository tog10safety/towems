# nginx site config for the TOWEMS production host (mrm-system.online).
#
# This file is the version-controlled copy of /etc/nginx/sites-enabled/mrm on the
# droplet (146.190.94.234). It is NOT applied automatically: edit it here, commit,
# pull on the droplet, then install and test it there:
#
#   sudo cp /var/www/towems/deploy/nginx/mrm-system.online.conf /etc/nginx/sites-enabled/mrm
#   sudo nginx -t && sudo systemctl reload nginx
#
# Check for drift (droplet vs. repo) at any time:
#
#   ssh root@146.190.94.234 "sed -n '/^server {/,$p' /etc/nginx/sites-enabled/mrm" \
#     | diff deploy/nginx/mrm-system.online.conf - && echo "no drift"
#
# Also tracked here because it is required for the performance work below:
# /etc/nginx/nginx.conf http{} must carry
#   gzip on; gzip_vary on; gzip_comp_level 5;
#   gzip_types text/plain text/css application/json application/javascript
#              text/xml application/xml application/xml+rss text/javascript
#              image/svg+xml;

server {
    listen 80;
    server_name mrm-system.online www.mrm-system.online 146.190.94.234;
    return 301 https://mrm-system.online$request_uri;
}

# Canonical host: www is redirected to the apex origin so cookies and CSRF
# stay on one origin.
server {
    listen 443 ssl http2;
    server_name www.mrm-system.online;

    ssl_certificate /etc/letsencrypt/live/mrm-system.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrm-system.online/privkey.pem;

    return 301 https://mrm-system.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mrm-system.online 146.190.94.234;

    ssl_certificate /etc/letsencrypt/live/mrm-system.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrm-system.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 20M;
    root /var/www/towems/toms_frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        client_max_body_size 20M;
    }

    # A missing hashed bundle must 404, not fall back to index.html.
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always; }

    location /static/  { alias /var/www/mrm/static/;  expires 30d; }
    location /uploads/ { alias /var/www/mrm/uploads/; expires 30d; }
    location /signatures/ { alias /var/www/mrm/signatures/; expires 30d; }
    location /approved_pdfs/ { alias /var/www/mrm/approved_pdfs/; expires 30d; }

    location / { try_files $uri $uri/ /index.html; }
}
